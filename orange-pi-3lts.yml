header:
  version: 14

machine: orange-pi-3lts
distro: poky
target: core-image-minimal-test

repos:
  poky:
    url: https://github.com/yoctoproject/poky.git
    commit: d0b46a6624ec9c61c47270745dd0b2d5abbe6ac1
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    commit: 07330a98cf93806b7a4e0170a541b94962ff3960
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-arm:
    url: https://github.com/jonmason/meta-arm.git
    commit: b68089f2648d712b9406d0e88c71758913267f81
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-sunxi:
    url: https://github.com/linux-sunxi/meta-sunxi.git
    commit: 3bf96b053a4348b3c7d90495f9c69d6ced6f8055
    layers:
      .:

  meta-op3:
    path: meta-op3
    layers:
      .:

local_conf_header:
  meta-op3: |
    PACKAGE_CLASSES ?= "package_rpm"
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    CONNECTIVITY_CHECK_URIS = "https://www.example.com/"
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
    # wifi: wpa_supplicant (standalone, cf. recipes-connectivity bbappend) + iw
    #       + wireless-regdb-static (kernel regulatory.db) + dhcpcd (auto IP)
    # bluetooth: bluez5/bluez5-obex, needs the "bluetooth" distro feature
    DISTRO_FEATURES:append = " bluetooth"
    IMAGE_INSTALL:append = " \
                            kernel-modules \
                            uwe5622-firmware \
                            linux-firmware-rtl8723 \
                            linux-firmware-bcm43430 \
                            wpa-supplicant \
                            iw \
                            wireless-regdb-static \
                            dhcpcd \
                            bluez5 \
                            bluez5-obex"
    # Fix: U-boot on Allwinner sets fdtfile="allwinner/<dtb>", so the DTB must
    # be in the allwinner/ subdirectory of the boot partition, not the root.
    # sunxi64.inc IMAGE_BOOT_FILES strips the directory prefix with .split('/')[-1],
    # so we override it here with the source;destination syntax.
    IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE} boot.scr sun50i-h6-orangepi-3-lts.dtb;allwinner/sun50i-h6-orangepi-3-lts.dtb"
